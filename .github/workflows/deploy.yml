name: Deploy CityRideTaxi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "================================"
            echo "CityRideTaxi Deployment Started"
            echo "================================"

            # =========================================
            # Load NVM / Node.js
            # =========================================

            export NVM_DIR="/home/cityride/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM not found at $NVM_DIR"
              exit 1
            fi

            source "$NVM_DIR/nvm.sh"

            nvm use 24

            echo ""
            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 -v

            # =========================================
            # Application directory
            # =========================================

            cd /var/www/cityridetaxi

            echo ""
            echo "Application directory:"
            pwd

            # =========================================
            # Pull latest code
            # =========================================

            echo ""
            echo "Pulling latest code..."

            git pull origin main

            # =========================================
            # Fix Nginx client_max_body_size for file uploads
            # =========================================

            echo ""
            echo "Ensuring Nginx allows large file uploads..."

            NGINX_CONF=$(nginx -T 2>/dev/null | grep -l "client_max_body_size" 2>/dev/null | head -1 || true)

            # Update in the main nginx.conf if not already 50m
            if grep -qr "client_max_body_size" /etc/nginx/; then
              echo "Patching existing client_max_body_size..."
              sudo sed -i 's/client_max_body_size\s\+[^;]*/client_max_body_size 50m/g' /etc/nginx/nginx.conf
              sudo sed -i 's/client_max_body_size\s\+[^;]*/client_max_body_size 50m/g' /etc/nginx/sites-enabled/* 2>/dev/null || true
              sudo sed -i 's/client_max_body_size\s\+[^;]*/client_max_body_size 50m/g' /etc/nginx/conf.d/* 2>/dev/null || true
            else
              echo "Injecting client_max_body_size 50m into nginx.conf http block..."
              sudo sed -i '/^http\s*{/a\    client_max_body_size 50m;' /etc/nginx/nginx.conf
            fi

            echo "Testing Nginx config..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo nginx -s reload

            echo "Nginx upload limit set to 50m."

            # =========================================
            # Install dependencies
            # =========================================

            echo ""
            echo "Installing production dependencies..."

            npm install --omit=dev

            # =========================================
            # Restart application
            # =========================================

            echo ""
            echo "Restarting CityRideTaxi..."

            pm2 restart cityride-api --update-env

            # =========================================
            # Save PM2
            # =========================================

            echo ""
            echo "Saving PM2 configuration..."

            pm2 save

            # =========================================
            # Show PM2 status
            # =========================================

            echo ""
            echo "PM2 status:"

            pm2 status

            # =========================================
            # Wait and check application
            # =========================================

            echo ""
            echo "Waiting for CityRideTaxi application..."

            sleep 5

            echo ""
            echo "Checking application health..."

            HEALTHY=false

            for i in {1..12}; do

              echo "Health check attempt $i/12..."

              if curl -fsS \
                --connect-timeout 3 \
                --max-time 10 \
                http://127.0.0.1:3000/ \
                > /dev/null; then

                echo ""
                echo "================================"
                echo "Application is HEALTHY"
                echo "================================"

                HEALTHY=true
                break
              fi

              if [ "$i" -lt 12 ]; then
                echo "Application not ready yet."
                echo "Retrying in 5 seconds..."
                sleep 5
              fi

            done

            # =========================================
            # Handle failed health check
            # =========================================

            if [ "$HEALTHY" != "true" ]; then

              echo ""
              echo "================================"
              echo "APPLICATION HEALTH CHECK FAILED"
              echo "================================"

              echo ""
              echo "PM2 status:"
              pm2 status

              echo ""
              echo "Port 3000:"
              ss -lntp | grep 3000 || true

              echo ""
              echo "Recent application logs:"
              pm2 logs cityride-api \
                --lines 100 \
                --nostream

              exit 1
            fi

            # =========================================
            # Final verification
            # =========================================

            echo ""
            echo "Final PM2 status:"

            pm2 status

            echo ""
            echo "================================"
            echo "CityRideTaxi Deployment Completed"
            echo "Successfully"
            echo "================================"