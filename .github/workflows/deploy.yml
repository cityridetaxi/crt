name: Deploy CityRideTaxi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "================================"
            echo "CityRideTaxi Deployment Started"
            echo "================================"

            # Load Node.js and PM2 installed through NVM
            export PATH="/home/cityride/.nvm/versions/node/v24.21.0/bin:$PATH"

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "PM2 version:"
            pm2 -v

            cd /var/www/cityridetaxi

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Restarting CityRideTaxi..."
            pm2 restart cityride-api --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Checking application..."
            pm2 status

            echo "Testing local API..."
            curl -f http://127.0.0.1:3000/ > /dev/null

            echo "================================"
            echo "Deployment Completed Successfully"
            echo "================================"