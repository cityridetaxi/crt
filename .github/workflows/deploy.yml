name: Deploy CityRideTaxi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "================================"
            echo "CityRideTaxi Deployment Started"
            echo "================================"

            # Load NVM
            export NVM_DIR="/home/cityride/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            # Use the installed Node version
            nvm use 24

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 -v

            cd /var/www/cityridetaxi

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Restarting CityRideTaxi..."
            pm2 restart cityride-api --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "PM2 status:"
            pm2 status

            echo "Testing application..."
            curl -f http://127.0.0.1:3000/ > /dev/null

            echo "================================"
            echo "Deployment Completed Successfully"
            echo "================================"